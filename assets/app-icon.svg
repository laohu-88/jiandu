<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16305c"/>
      <stop offset=".55" stop-color="#0d2145"/>
      <stop offset="1" stop-color="#071228"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e5c8"/>
      <stop offset="1" stop-color="#7d90ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a38"/>
      <stop offset="1" stop-color="#050d1e"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59e8cf"/>
      <stop offset=".5" stop-color="#8fa2ff"/>
      <stop offset="1" stop-color="#e7ecff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#01050f" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="44" y="44" width="936" height="936" rx="212" fill="url(#bg)"/>
  <rect x="44" y="44" width="936" height="936" rx="212" fill="url(#glass)"/>

  <!-- water -->
  <path d="M44 700 h936 v68 a212 212 0 0 1-212 212 H256 A212 212 0 0 1 44 792 Z"
        fill="url(#water)"/>
  <path d="M110 706 h360 M560 706 h300" stroke="#2b4b86" stroke-width="10"
        stroke-linecap="round" opacity=".55"/>
  <path d="M160 760 h250 M520 760 h330" stroke="#25406f" stroke-width="9"
        stroke-linecap="round" opacity=".5"/>

  <!-- source cards (left) -->
  <g filter="url(#soft)">
    <rect x="118" y="420" width="164" height="112" rx="26" fill="#f2f7ff"/>
    <rect x="146" y="450" width="76" height="14" rx="7" fill="#a9bdd9"/>
    <rect x="146" y="478" width="52" height="14" rx="7" fill="#bccfe6"/>
    <rect x="150" y="560" width="164" height="96" rx="24" fill="#dde9fa"/>
    <rect x="176" y="588" width="66" height="13" rx="6.5" fill="#93aac9"/>
  </g>

  <!-- timeline (right): FCP magnetic timeline segments -->
  <g filter="url(#soft)">
    <rect x="706" y="470" width="200" height="46" rx="23" fill="url(#tl)"/>
    <rect x="742" y="530" width="128" height="30" rx="15" fill="#c9d4ef"/>
    <rect x="690" y="436" width="34" height="84" rx="12" fill="#fbfdff"/>
  </g>

  <!-- ferry bridge (center): arch + deck + pylons -->
  <g filter="url(#soft)">
    <path d="M330 652
             C 430 512, 594 512, 694 652"
          fill="none" stroke="url(#bridge)" stroke-width="58" stroke-linecap="round"/>
    <path d="M296 652 h432" stroke="#eaf2ff" stroke-width="30" stroke-linecap="round"/>
    <path d="M366 652 V560 M480 652 V522 M594 652 V560"
          stroke="#dbe6fb" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- inner hairline -->
  <rect x="56" y="56" width="912" height="912" rx="202" fill="none"
        stroke="#ffffff" stroke-opacity=".14" stroke-width="6"/>
</svg>
