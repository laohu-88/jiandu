<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪渡</title>
    <link rel="stylesheet" href="./styles/index.css">
  </head>
  <body class="app-body">
    <div class="app-frame">
      <aside id="navSidebar" class="nav-sidebar" aria-label="主导航"></aside>
      <div class="app-main">
        <header class="app-topbar">
          <div>
            <p class="eyebrow">剪渡 · Jiandu</p>
            <h1 class="app-title">AI → Final Cut Pro</h1>
          </div>
          <span id="version" class="version">正在读取版本…</span>
        </header>

        <div id="pendingView" class="view-panel"></div>
        <div id="libraryView" class="view-panel hidden"></div>
        <div id="settingsView" class="view-panel hidden"></div>

        <div id="workspaceView" class="workspace-view hidden">
          <header id="workspaceHeader" class="workspace-header sticky"></header>
          <div id="pageBrief" class="project-page"></div>
          <div id="pageProcessing" class="project-page hidden"></div>
          <div id="pageResults" class="project-page hidden"></div>
        </div>
      </div>
    </div>

    <div id="overlayRoot" class="overlay-root hidden" hidden></div>
    <div id="toast" class="toast hidden" role="status"></div>

    <script src="../view-models/workspace-view-model.js"></script>
    <script src="../view-models/index.js"></script>
    <script src="./modules/utils.js"></script>
    <script src="./modules/state.js"></script>
    <script src="./modules/router.js"></script>
    <script src="./modules/ipc-client.js"></script>
    <script src="./modules/components/dom.js"></script>
    <script src="./modules/app-data.js"></script>
    <script src="./modules/catalog/library-page.js"></script>
    <script src="./modules/pending/pending-page.js"></script>
    <script src="./modules/workspace/settings-page.js"></script>
    <script src="./modules/workspace/task-pages.js"></script>
    <script src="./modules/workspace/workspace-shell.js"></script>
    <script src="./modules/shell.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
